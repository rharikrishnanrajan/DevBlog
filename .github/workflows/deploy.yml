name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Required permissions for official GitHub Pages deployment actions
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; cancel in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ── 1. Checkout the repository ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # ── 2. Configure GitHub Pages ───────────────────────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ── 3. Inject the production API URL into index.html ────────────────────
      #    Replaces the __INJECT_API_URL__ placeholder with the real backend URL.
      #    Set the API_URL secret or variable in: Settings > Secrets and variables > Actions
      #    Example value: https://developer-blog-backend.onrender.com/api
      - name: Inject API URL into index.html
        env:
          API_URL: ${{ vars.API_URL || secrets.API_URL }}
        run: |
          TARGET_URL="${API_URL:-https://developer-blog-backend.onrender.com/api}"
          if [ -z "$API_URL" ]; then
            echo "::warning::API_URL is not set in GitHub secrets or variables. Using default fallback: ${TARGET_URL}"
          fi
          sed -i "s|__INJECT_API_URL__|${TARGET_URL}|g" frontend/index.html
          echo "Injected API_URL: ${TARGET_URL}"

      # ── 4. Verify injection worked (grep for leftover placeholder = bad) ──────
      - name: Verify injection
        run: |
          if grep -q "__INJECT_API_URL__" frontend/index.html; then
            echo "ERROR: Placeholder was NOT replaced. Check API_URL configuration."
            exit 1
          fi
          echo "Injection verified. Live API_URL in index.html:"
          grep "window.__API_URL__" frontend/index.html

      # ── 5. Upload frontend/ as a Pages artifact ───────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend

      # ── 6. Deploy to GitHub Pages ─────────────────────────────────────────────
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
