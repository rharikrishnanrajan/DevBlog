name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Required permissions for official GitHub Pages deployment actions
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; cancel in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ── 1. Checkout the repository ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # ── 2. Configure GitHub Pages ───────────────────────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ── 3. Inject the production API URL into index.html ────────────────────
      #    Replaces the __INJECT_API_URL__ placeholder with the real backend URL.
      #    Set the API_URL secret in: Settings > Secrets and variables > Actions
      #    Example value: https://my-blog-backend.onrender.com/api
      - name: Inject API URL into index.html
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "WARNING: API_URL secret is not set. Using localhost fallback."
            API_URL="http://localhost:5000/api"
          fi
          sed -i "s|__INJECT_API_URL__|${API_URL}|g" frontend/index.html
          echo "Injected API_URL: ${API_URL}"

      # ── 4. Verify injection worked ───────────────────────────────────────────
      - name: Verify injection
        run: grep -n "__API_URL__" frontend/index.html || echo "Placeholder replaced successfully"

      # ── 5. Upload frontend/ as a Pages artifact ───────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend

      # ── 6. Deploy to GitHub Pages ─────────────────────────────────────────────
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
