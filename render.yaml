# render.yaml — Render Infrastructure as Code
# Docs: https://render.com/docs/infrastructure-as-code
#
# HOW TO DEPLOY FRONTEND + BACKEND TOGETHER:
#   1. Push this repo to GitHub.
#   2. Go to https://dashboard.render.com/
#   3. Click "New +" → "Blueprint" → select this repository.
#   4. Render will automatically detect this blueprint and deploy the unified Full-Stack Web Service.
#   5. Both your Frontend UI and REST API will be live on a single URL!

services:
  - type: web
    name: developer-blog
    runtime: node
    rootDir: .
    region: singapore         # Choose: singapore, oregon, frankfurt, ohio
    plan: free                # Free tier

    buildCommand: npm install && npm run build
    startCommand: npm start

    # Health check path
    healthCheckPath: /api/health

    # Auto-deploy on every push to main branch
    autoDeploy: true

    envVars:
      - key: PORT
        value: 10000          # Render's internal port

      # ── MySQL Database (Optional / Aiven Cloud) ──────────────────────────────
      # If not set, app runs smoothly with built-in resilient in-memory fallback
      - key: DB_HOST
        sync: false

      - key: DB_PORT
        sync: false

      - key: DB_USER
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: DB_NAME
        value: blog

      # Aiven MySQL requires SSL; set to 'true' to enable, 'false' to disable
      - key: DB_SSL
        value: "true"

      # For Aiven's self-signed CA cert, set to 'false' to skip strict cert verification
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"

      - key: FRONTEND_URL
        value: "*"
